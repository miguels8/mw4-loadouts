name: refresh-and-deploy
# Every 3 hours (GitHub schedule; the MiguelPC mw4-kick timer starts this workflow when the scheduler skips a slot): read CODMunity, Infil, MW4 Intel and Dexerto (no AI, no secrets), commit changed data to main and
# deploy the site to GitHub Pages ONLY when a source changed. Every run, changed or not, writes the heartbeat
# (status.json) to the `status` branch, which the app and the MiguelPC alarm read; that branch has no Pages deploy.
# A source that cannot be read keeps its old build, marks the app's data line red, and fails this run (loud).
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh data (scheduled and manual runs only)
        id: refresh
        if: github.event_name != 'push'
        continue-on-error: true
        run: python3 -I scripts/refresh.py   # prints DATA_CHANGED=0|1 and sets the step output changed=true|false
      - name: Commit changed data
        if: github.event_name != 'push' && steps.refresh.outputs.changed == 'true'
        run: |
          git config user.name "mw4-loadouts-bot"
          git config user.email "mw4-loadouts-bot@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then echo "no data change"; else
            git commit -m "data: refresh $(date -u +%F)"
            git push origin HEAD:main
          fi
      - name: Heartbeat to the status branch (no Pages deploy)
        if: always() && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # scripts/heartbeat.py runs every git call in a fresh empty directory: this repo's checkout already holds an
        # auth header, and a second one makes GitHub answer 400 "Duplicate header: Authorization". Fails loudly.
        run: |
          export MW4_GIT_EXTRAHEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          python3 -I scripts/heartbeat.py --remote "https://github.com/${GITHUB_REPOSITORY}.git" --file site/data/status.json
      - uses: actions/configure-pages@v5
        if: github.event_name != 'schedule' || steps.refresh.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || steps.refresh.outputs.changed == 'true'
        with:
          path: site
      - id: deployment
        if: github.event_name != 'schedule' || steps.refresh.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
      - name: Fail loudly when a source could not be read
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::error::refresh failed: see site/data/status.json (failed list). The site shows the data as stale."
          exit 1
